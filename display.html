<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>ゴーゴークイック - 表示</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: transparent;
    overflow: hidden;
    font-family: "Yu Gothic", "Meiryo", "Segoe UI", sans-serif;
  }

  :root {
    --ow-orange: #F99E1A;
    --ow-dark: #10151F;
    --ow-dark2: #1B2432;
    --ow-white: #F4F4F4;
    --ow-red: #E0442E;
    --ow-green: #7CD87C;
  }

  #panel {
    position: fixed;
    top: 24px;
    right: 24px;
    min-width: 260px;
    display: flex;
    flex-direction: column;
    padding: 14px 22px 18px;
    background: linear-gradient(135deg, var(--ow-dark2), var(--ow-dark));
    border: 2px solid var(--ow-orange);
    border-radius: 16px;
    box-shadow: 0 4px 18px rgba(0,0,0,0.5);
  }

  #label {
    color: var(--ow-orange);
    font-weight: 900;
    font-size: 16px;
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-bottom: 10px;
    text-shadow: 0 0 8px rgba(249,158,26,0.5);
  }

  #board {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .row {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 16px;
    padding: 4px 2px;
    border-bottom: 1px solid rgba(255,255,255,0.08);
  }

  .row .name {
    color: var(--ow-white);
    font-weight: 700;
    font-size: 18px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 160px;
  }

  .row .value {
    font-weight: 900;
    font-size: 24px;
    color: var(--ow-white);
    transition: color 0.2s ease;
  }

  .row .value.positive { color: var(--ow-green); }
  .row .value.negative { color: var(--ow-red); }

  .row.pulse .value {
    animation: pulse 0.35s ease;
  }

  #empty {
    color: #777;
    font-size: 13px;
    padding: 4px 2px;
  }

  @keyframes pulse {
    0%   { transform: scale(1); }
    35%  { transform: scale(1.35); }
    100% { transform: scale(1); }
  }

  #event-overlay {
    position: fixed;
    top: 210px;
    right: 24px;
    max-width: 340px;
    transform: translateX(140%);
    opacity: 0;
    pointer-events: none;
  }

  #event-overlay .card {
    padding: 16px 20px;
    background: linear-gradient(135deg, var(--ow-dark2), var(--ow-dark));
    border-radius: 12px;
    text-shadow: 0 0 12px rgba(0,0,0,0.6);
  }

  #event-overlay.bonus .card {
    border: 2px solid var(--ow-orange);
    box-shadow: 0 8px 28px rgba(0,0,0,0.6), 0 0 22px rgba(249,158,26,0.4);
  }
  #event-overlay.penalty .card {
    border: 2px solid var(--ow-red);
    box-shadow: 0 8px 28px rgba(0,0,0,0.6), 0 0 22px rgba(224,68,46,0.4);
  }

  #event-overlay .badge {
    font-weight: 900;
    font-size: 22px;
    letter-spacing: 3px;
    text-transform: uppercase;
  }
  #event-overlay.bonus .badge { color: var(--ow-orange); }
  #event-overlay.penalty .badge { color: var(--ow-red); }

  #event-overlay .who {
    color: var(--ow-white);
    font-weight: 700;
    font-size: 16px;
    margin-top: 4px;
  }

  #event-overlay .effect {
    margin-top: 8px;
    color: #ddd;
    font-size: 13px;
    font-weight: 600;
    line-height: 1.6;
    white-space: pre-line;
  }

  #event-overlay.show {
    animation: toastShow 3.6s cubic-bezier(0.22, 1, 0.36, 1) forwards;
  }

  @keyframes toastShow {
    0%   { opacity: 0; transform: translateX(140%); }
    8%   { opacity: 1; transform: translateX(0); }
    85%  { opacity: 1; transform: translateX(0); }
    100% { opacity: 0; transform: translateX(140%); }
  }
</style>
</head>
<body>

<div id="panel">
  <div id="label">ゴーゴークイック</div>
  <div id="board"></div>
</div>

<div id="event-overlay">
  <div class="card">
    <div class="badge"></div>
    <div class="who"></div>
    <div class="effect"></div>
  </div>
</div>

<script type="module">
  import { db, auth } from './firebase-config.js';
  import { ref, onValue } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-database.js";
  import { signInAnonymously } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";

  let prevPoints = {};

  function render(users) {
    const board = document.getElementById('board');
    const empty = document.getElementById('empty');

    if (users.length === 0) {
      board.innerHTML = '<div id="empty">参加者はまだいません</div>';
      prevPoints = {};
      return;
    }

    const sorted = [...users].sort((a, b) => b.points - a.points);

    board.innerHTML = '';
    sorted.forEach(u => {
      const row = document.createElement('div');
      row.className = 'row';

      const nameEl = document.createElement('div');
      nameEl.className = 'name';
      nameEl.textContent = u.name;

      const valEl = document.createElement('div');
      valEl.className = 'value';
      valEl.textContent = (u.points > 0 ? '+' : '') + u.points;
      valEl.classList.toggle('positive', u.points > 0);
      valEl.classList.toggle('negative', u.points < 0);

      if (prevPoints[u.name] !== undefined && prevPoints[u.name] !== u.points) {
        row.classList.add('pulse');
      }

      row.appendChild(nameEl);
      row.appendChild(valEl);
      board.appendChild(row);
    });

    const next = {};
    users.forEach(u => { next[u.name] = u.points; });
    prevPoints = next;
  }

  const EFFECT_TEXT = {
    bonus: '次の回は抜けられる（フルパ以上）\nor 指定キャラを使う（フルパ以下）',
    penalty: 'IGLの権利 1ウェーブ'
  };

  function showEvent(type, name) {
    const overlay = document.getElementById('event-overlay');

    overlay.querySelector('.badge').textContent = type === 'bonus' ? 'BONUS!' : 'PENALTY!';
    overlay.querySelector('.who').textContent = name || '';
    overlay.querySelector('.effect').textContent = EFFECT_TEXT[type] || '';

    overlay.classList.remove('show', 'bonus', 'penalty');
    void overlay.offsetWidth;
    overlay.classList.add('show', type);
  }

  signInAnonymously(auth).then(() => {
    onValue(ref(db, 'users'), (snap) => {
      const val = snap.val() || {};
      const users = Object.values(val);
      render(users);
    });

    // onValueはリスナー登録時に現在値で即発火するため、初回は「起動前からある古いイベント」として無視する。
    let eventReady = false;
    onValue(ref(db, 'event'), (snap) => {
      if (!eventReady) {
        eventReady = true;
        return;
      }
      const data = snap.val();
      if (!data) return;
      showEvent(data.type, data.name);
    });
  });
</script>

</body>
</html>
